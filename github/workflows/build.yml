name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: unzip -q CarLauncher.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: CarLauncher
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: car-launcher-apk
          path: CarLauncher/app/build/outputs/apk/debug/app-debug.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Car Launcher (последняя сборка)
          files: CarLauncher/app/build/outputs/apk/debug/app-debug.apk
